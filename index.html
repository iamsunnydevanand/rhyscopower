  <script>
  // ======// gitPull function complete karo
async function gitPull() {
  const r = await gh(`/contents/${G.path}`);
  const d = JSON.parse(atob(r.content));
  if (d.cat?.length) S.cat = d.cat;
  if (d.com?.name) S.com = {...DEF.com, ...d.com};

}
