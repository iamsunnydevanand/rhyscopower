<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Rhysco Power</title>
  <style>
    :root { --bg:#f8f9fc; --bg2:#fff; --text:#1a1a2e; --text2:#5a5a7a; --border:rgba(0,0,0,0.06); --card:rgba(255,255,255,0.85); --nav:rgba(255,255,255,0.8); --grad:linear-gradient(135deg,#0ea5e9,#6366f1,#a855f7); --grad2:linear-gradient(135deg,#f59e0b,#ef4444); --wa:#25D366; --ok:#10b981; --err:#ef4444; }
    [data-theme="dark"] { --bg:#06060c; --bg2:#0f0f18; --text:#f0f0f5; --text2:#8888a0; --border:rgba(255,255,255,0.06); --card:rgba(18,18,30,0.8); --nav:rgba(10,10,18,0.8); }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); }
    button { cursor:pointer; border:none; background:none; color:inherit; font:inherit; }
    input { padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); width:100%; font:inherit; }
    .grd { background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:800; }
    
    .nav { position:fixed; top:10px; left:50%; transform:translateX(-50%); width:95%; max-width:1100px; z-index:999; background:var(--nav); backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:999px; padding:8px 20px; display:flex; align-items:center; justify-content:space-between; }
    .nav .logo { font-weight:800; font-size:16px; }
    .nav .links { display:flex; gap:2px; }
    .nav .links a { padding:8px 14px; border-radius:999px; font-size:13px; opacity:.8; }
    .nav .links a:hover { opacity:1; background:var(--border); }
    .btn { padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px; background:var(--grad); color:#fff; }
    .btn2 { padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px; background:var(--ok); color:#fff; }
    .btn3 { padding:10px 18px; border-radius:10px; font-weight:700; font-size:13px; background:var(--err); color:#fff; }
    
    .hero { min-height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:100px 20px; background:linear-gradient(135deg,rgba(99,102,241,.3),rgba(14,165,233,.2)),url('https://images.unsplash.com/photo-1473073077800-fe50b8c5e0c2?w=1400&q=80') center/cover; }
    .hero h1 { color:#fff; font-size:clamp(36px,7vw,68px); font-weight:900; }
    .hero p { color:rgba(255,255,255,.85); font-size:16px; max-width:500px; margin:12px auto 24px; }
    .hero a { display:inline-block; padding:14px 28px; border-radius:999px; background:var(--grad); color:#fff; font-weight:700; }
    
    .sec { max-width:1100px; margin:0 auto; padding:60px 20px; }
    .sec h2 { font-size:clamp(26px,4vw,40px); font-weight:900; text-align:center; margin-bottom:30px; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); }
    .card { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:18px; }
    .card h3 { font-size:14px; margin:6px 0; }
    .card .spec { font-size:11px; color:#0ea5e9; font-weight:600; }
    .card p { font-size:12px; color:var(--text2); }
    .card .btns { display:flex; gap:6px; margin-top:10px; }
    .card .btns a, .card .btns button { flex:1; padding:8px; border-radius:999px; font-size:11px; font-weight:700; text-align:center; color:#fff; }
    .card .btns .wa { background:var(--wa); }
    .card .btns .det { background:var(--grad); }
    
    .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; max-width:1100px; margin:-50px auto 0; padding:0 20px; position:relative; z-index:5; }
    .stat { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; text-align:center; }
    .stat .num { font-size:26px; font-weight:900; color:#6366f1; }
    .stat .lbl { font-size:10px; text-transform:uppercase; color:var(--text2); }
    
    .feat-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); }
    .feat { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:20px; text-align:center; }
    .feat h4 { font-size:14px; font-weight:800; }
    .feat p { font-size:12px; color:var(--text2); }
    
    .contact { display:grid; grid-template-columns:1fr 1fr; border-radius:20px; overflow:hidden; border:1px solid var(--border); }
    .contact .left { padding:30px; background:var(--grad); color:#fff; }
    .contact .left h2 { font-size:28px; font-weight:900; text-align:left; }
    .contact .right { padding:30px; background:var(--card); }
    
    footer { text-align:center; padding:30px; color:var(--text2); font-size:12px; border-top:1px solid var(--border); }
    .float { position:fixed; right:16px; bottom:16px; width:48px; height:48px; background:var(--wa); border-radius:50%; display:grid; place-items:center; color:#fff; font-size:22px; z-index:90; }
    
    .modal { position:fixed; inset:0; z-index:9999; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; padding:16px; }
    .modal.open { display:flex; }
    .modal .card { width:100%; max-width:500px; max-height:85vh; background:var(--bg2); overflow-y:auto; }
    .fld { margin-bottom:10px; }
    .fld label { display:block; font-size:11px; font-weight:600; margin-bottom:4px; }
    .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:var(--bg2); border:1px solid var(--border); padding:10px 18px; border-radius:12px; font-size:13px; font-weight:600; z-index:9999; opacity:0; transition:all .3s; }
    .toast.show { opacity:1; }
    .sync { position:fixed; top:0; left:0; right:0; z-index:9999; padding:6px; text-align:center; font-size:12px; font-weight:600; color:#fff; display:none; }
    .sync.on { display:block; }
    .sync.load { background:#f59e0b; }
    .sync.ok { background:#10b981; }
    .sync.fail { background:#ef4444; }
    
    @media(max-width:768px){.nav .links{display:none}.stats{grid-template-columns:repeat(2,1fr)}.contact{grid-template-columns:1fr}}
  </style>
</head>
<body>

<div class="sync" id="sync"></div>

<nav class="nav">
  <span class="logo"><span class="grd" id="navName">Rhysco Power</span></span>
  <div class="links"><a href="#home">Home</a><a href="#cat">Products</a><a href="#feat">Features</a><a href="#contact">Contact</a></div>
  <button class="btn" id="adminBtn" onclick="openAdmin()">🔑 Admin</button>
</nav>

<section class="hero" id="home">
  <h1 id="heroTitle">Complete <span class="grd">Electrical</span> Solutions</h1>
  <p id="heroSub"></p>
  <a href="#cat">Explore Products →</a>
</section>

<div class="stats" id="statsGrid"></div>

<section class="sec" id="cat">
  <h2>Our <span class="grd">Products</span></h2>
  <div style="max-width:500px;margin:0 auto 20px;display:flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px">
    <input type="search" id="searchInput" placeholder="Search…" style="border:none;background:transparent"><button id="clearBtn" style="display:none;padding:8px 16px;border-radius:999px;background:var(--grad);color:#fff;font-weight:700;font-size:12px" onclick="clearSearch()">Clear</button>
  </div>
  <div class="grid" id="prodGrid"></div>
</section>

<section class="sec" id="feat">
  <h2>Why <span class="grd">Choose Us</span></h2>
  <div class="feat-grid" id="featGrid"></div>
</section>

<section class="sec" id="contact">
  <div class="contact">
    <div class="left"><h2>Let's Talk</h2><p style="margin-top:10px">Reach out for enquiries or bulk orders.</p><a id="contactWa" href="#" target="_blank" style="display:inline-block;margin-top:16px;padding:12px 22px;border-radius:999px;background:var(--wa);color:#fff;font-weight:700">💬 WhatsApp</a></div>
    <div class="right" id="contactRight"></div>
  </div>
</section>

<footer>© <span id="footerYear"></span> <span id="footerName"></span></footer>
<a class="float" id="floatWa" href="#" target="_blank">💬</a>

<div class="modal" id="adminModal"><div class="card" style="max-width:550px"><h3 style="margin-bottom:14px">Admin Panel</h3><div id="adminTabs" style="display:flex;gap:4px;background:var(--border);border-radius:12px;padding:3px;margin-bottom:14px"></div><div id="adminPane"></div><button class="btn3" style="margin-top:10px;width:100%" onclick="closeAdmin()">Close</button></div></div>
<div class="toast" id="toast"></div>

<script>
// ========== COMPLETE WORKING CODE v7 ==========
'use strict';
console.clear();
console.log('🚀 Rhysco Power v7 — FORCE UPDATE FIX');

// DATA
const DEFCAT = [{id:'cat_WAA',name:'WAA Cables',icon:'🔌',prods:[{id:'p_1',name:'4.0 SQMM WAA CABLE RED BLACK',spec:'100 MTR',icon:'🔌',desc:'Premium 100% pure copper flexible cable'}]}];
const DEF = {
  cat: JSON.parse(JSON.stringify(DEFCAT)),
  com: {name:'Rhysco Power',ph:'+91 6203691393',em:'test@test.com',wa:'916203691393',ad:'India',ht:'Complete Electrical Solutions',hs:'WAA Cables • Solar • MC4 • Meters'},
  st: [{n:'15+',l:'Years'},{n:'1',l:'Products'},{n:'1000+',l:'Clients'},{n:'PAN India',l:'Delivery'}],
  ft: [{t:'Quality',d:'ISO certified'},{t:'Support',d:'24/7 available'},{t:'Delivery',d:'Nationwide'},{t:'Price',d:'Wholesale'}]
};

// GIT CONFIG
let G = {owner:'',token:'',repo:'rhysco-data',branch:'main',path:'data.json',ok:!1};
try{let s=JSON.parse(localStorage.getItem('rc_git')||'{}');if(s.owner&&s.token){G.owner=s.owner;G.token=s.token;G.repo=s.repo||'rhysco-data';G.branch=s.branch||'main';G.ok=!0}}catch{}

// STATE
let S = {
  cat:JSON.parse(JSON.stringify(DEF.cat)),com:{...DEF.com},st:JSON.parse(JSON.stringify(DEF.st)),ft:JSON.parse(JSON.stringify(DEF.ft)),
  adm:!!(function(){try{return localStorage.getItem('rc_auth')==='1'}catch{return!1}}()),
  q:'',tab:'company'
};
let syncTimer;

// HELPERS
const wa=t=>`https://wa.me/${S.com.wa}?text=${encodeURIComponent(t)}`;
const flat=()=>S.cat.flatMap(c=>c.prods.map(p=>({...p,cid:c.id,cn:c.name,ci:c.icon})));
const refresh=()=>{RC();RSt();RP();RF();};
function toast(m,d=2500){let t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window._tt);window._tt=setTimeout(()=>t.classList.remove('show'),d)}
function syn(m,c){let b=document.getElementById('sync');b.textContent=m;b.className='sync on '+c;setTimeout(()=>b.className='sync',c==='ok'?2000:4000)}

// THEME
(function(){let t=(()=>{try{return localStorage.getItem('rc_theme')||'dark'}catch{return'dark'}})();document.documentElement.dataset.theme=t})();

// GITHUB API
async function gh(ep,m='GET',body=null){
  if(!G.token)throw new Error('Token missing');
  let c=new AbortController(),to=setTimeout(()=>c.abort(),12000);
  try{
    let r=await fetch(`https://api.github.com/repos/${encodeURIComponent(G.owner)}/${encodeURIComponent(G.repo)}${ep}`,{
      method:m,signal:c.signal,
      headers:{'Authorization':`Bearer ${G.token}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:body?JSON.stringify(body):null
    });
    clearTimeout(to);
    let j=await r.json();
    if(!r.ok)throw new Error(r.status===401?'Invalid token':r.status===404?'Repo not found':j.message||'Error');
    return j;
  }catch(e){clearTimeout(to);throw e}
}

async function gitPush(){
  let d={cat:S.cat,com:S.com,st:S.st,ft:S.ft,ts:new Date().toISOString()};
  let sha=null;
  try{sha=(await gh(`/contents/${G.path}`)).sha}catch{}
  let content=btoa(unescape(encodeURIComponent(JSON.stringify(d,null,2))));
  await gh(`/contents/${G.path}`,'PUT',{message:`Update ${new Date().toLocaleString()}`,content,branch:G.branch,...(sha?{sha}:{})});
}

async function gitPull(){
  console.log('📥 Pulling from GitHub...');
  let r=await gh(`/contents/${G.path}`);
  let d=JSON.parse(atob(r.content));
  console.log('📦 Data:',d);
  
  // FORCE UPDATE
  if(d.cat?.length)S.cat=d.cat;
  if(d.com?.name)S.com={...DEF.com,...d.com};
  if(d.st?.length)S.st=d.st;
  if(d.ft?.length)S.ft=d.ft;
  
  // FORCE REFRESH ALL UI
  RC();RSt();RP();RF();
  console.log('✅ UI updated with GitHub data');
}

// RENDER
function RC(){
  document.getElementById('navName').textContent=S.com.name;
  document.getElementById('footerName').textContent=S.com.name;
  document.getElementById('footerYear').textContent=new Date().getFullYear();
  document.title=S.com.name;
  document.getElementById('heroTitle').innerHTML=S.com.ht.replace(/Electrical/gi,'<span class="grd">Electrical</span>');
  document.getElementById('heroSub').textContent=S.com.hs;
  document.getElementById('floatWa').href=wa('Hi');
  document.getElementById('contactWa').href=wa('Hi');
  document.getElementById('contactRight').innerHTML=[{l:'Phone',v:S.com.ph},{l:'WhatsApp',v:'+'+S.com.wa},{l:'Email',v:S.com.em},{l:'Address',v:S.com.ad}].map(i=>`<div style="padding:8px"><strong>${i.l}:</strong> ${i.v}</div>`).join('');
}

function RSt(){
  document.getElementById('statsGrid').innerHTML=S.st.map(s=>`<div class="stat"><div class="num">${s.n}</div><div class="lbl">${s.l}</div></div>`).join('');
}

function RF(){
  document.getElementById('featGrid').innerHTML=S.ft.map(f=>`<div class="feat"><h4>${f.t}</h4><p>${f.d}</p></div>`).join('');
}

function RP(){
  let g=document.getElementById('prodGrid');
  let all=flat();
  let f=S.q.trim().toLowerCase()?all.filter(p=>p.name.toLowerCase().includes(S.q.trim().toLowerCase())):all;
  if(!f.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)">No products</div>';return}
  g.innerHTML=f.map(p=>`<div class="card"><div style="font-size:28px">${p.icon}</div><h3>${p.name}</h3><div class="spec">📏 ${p.spec}</div><p>${p.desc}</p><div class="btns"><a class="wa" href="${wa('Interested: '+p.name)}" target="_blank">💬 Enquiry</a><button class="det">Details</button></div></div>`).join('');
}

function clearSearch(){S.q='';document.getElementById('searchInput').value='';document.getElementById('clearBtn').style.display='none';RP()}

// ADMIN
function openAdmin(){document.getElementById('adminModal').classList.add('open');renderAdmin()}
function closeAdmin(){document.getElementById('adminModal').classList.remove('open')}
function login(){
  if(document.getElementById('au')?.value?.trim()==='sunny'&&document.getElementById('ap')?.value==='admin'){
    S.adm=!0;try{localStorage.setItem('rc_auth','1')}catch{}updateBtn();renderAdmin();toast('Welcome!');
  }else{let e=document.getElementById('le');if(e)e.textContent='Invalid'}
  return!1;
}
function logout(){S.adm=!1;try{localStorage.removeItem('rc_auth')}catch{}updateBtn();closeAdmin()}
function updateBtn(){
  let b=document.getElementById('adminBtn');
  if(S.adm){b.textContent='Logout';b.onclick=logout;b.style.background='#ef4444'}
  else{b.textContent='🔑 Admin';b.onclick=openAdmin;b.style.background='var(--grad)'}
}

function renderAdmin(){
  if(!S.adm){
    document.getElementById('adminTabs').innerHTML='';
    document.getElementById('adminPane').innerHTML=`<form onsubmit="return login()" style="max-width:260px;margin:0 auto;display:flex;flex-direction:column;gap:10px"><h4 style="text-align:center">Admin Login</h4><div class="fld"><label>Username</label><input id="au" required></div><div class="fld"><label>Password</label><input id="ap" type="password" required></div><div id="le" style="color:#ef4444;font-size:11px;text-align:center"></div><button class="btn" type="submit">Sign In</button></form>`;
    return;
  }
  document.getElementById('adminTabs').innerHTML=`<button class="btn" style="${S.tab==='company'?'opacity:1':'opacity:.5'};font-size:11px;flex:1" onclick="setTab('company')">Company</button><button class="btn2" style="${S.tab==='git'?'opacity:1':'opacity:.5'};font-size:11px;flex:1" onclick="setTab('git')">🔗 Git</button>`;
  renderPane();
}
function setTab(t){S.tab=t;renderAdmin()}
function renderPane(){
  let p=document.getElementById('adminPane');
  if(S.tab==='company'){
    p.innerHTML=`<h4 style="margin-bottom:10px">Company Settings</h4><div class="fld"><label>Name</label><input value="${S.com.name}" oninput="updateField('name',this.value)"></div><div class="fld"><label>Hero Title</label><input value="${S.com.ht}" oninput="updateField('ht',this.value)"></div><div class="fld"><label>Hero Subtitle</label><input value="${S.com.hs}" oninput="updateField('hs',this.value)"></div><div class="fld"><label>Phone</label><input value="${S.com.ph}" oninput="updateField('ph',this.value)"></div><div class="fld"><label>WhatsApp</label><input value="${S.com.wa}" oninput="updateField('wa',this.value)"></div><div class="fld"><label>Email</label><input value="${S.com.em}" oninput="updateField('em',this.value)"></div><p style="font-size:10px;color:var(--text2);margin-top:8px">Auto-saves to GitHub every 3 seconds</p>`;
  }
  if(S.tab==='git'){
    p.innerHTML=`<h4 style="margin-bottom:10px">GitHub Sync</h4><p style="font-size:11px;color:var(--text2);margin-bottom:10px">Token: <a href="https://github.com/settings/tokens" target="_blank" style="color:#0ea5e9">github.com/settings/tokens</a> → <b>repo</b> scope</p><div class="fld"><label>GitHub Username</label><input id="go" value="${G.owner}" placeholder="username"></div><div class="fld"><label>Token</label><input id="gt" type="password" value="${G.token}" placeholder="ghp_..."></div><div class="fld"><label>Repo</label><input id="gr" value="${G.repo}" placeholder="rhysco-data"></div><div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn" onclick="saveGit()">💾 Save & Sync</button>${G.ok?`<button class="btn2" onclick="gitPush().then(()=>toast('✅ Pushed')).catch(e=>toast('❌ '+e.message))">📤 Push</button><button class="btn2" onclick="gitPull().then(()=>toast('✅ Loaded! Refresh page')).catch(e=>toast('❌ '+e.message))">📥 Pull</button>`:''}</div><div style="margin-top:8px;font-size:11px"><b>${G.ok?'✅ Connected to '+G.owner+'/'+G.repo:'⚡ Not connected'}</b></div>`;
  }
}

function updateField(k,v){
  S.com[k]=v;
  RC(); // Update UI immediately
  clearTimeout(syncTimer);
  if(G.ok)syncTimer=setTimeout(()=>gitPush().then(()=>console.log('✅ Auto-synced')).catch(e=>console.log('Sync:',e.message)),3000);
}

async function saveGit(){
  let o=document.getElementById('go')?.value?.trim(),t=document.getElementById('gt')?.value?.trim();
  if(!o||!t)return toast('⚠️ Username & token required');
  G.owner=o;G.token=t;G.repo=document.getElementById('gr')?.value?.trim()||'rhysco-data';G.ok=!0;
  try{localStorage.setItem('rc_git',JSON.stringify({owner:o,token:t,repo:G.repo,branch:'main'}))}catch{}
  try{
    await gitPush();
    toast('✅ Connected & synced! All devices will see changes.');
  }catch(e){toast('⚠️ '+e.message)}
  renderAdmin();
}

// EVENTS
document.getElementById('searchInput').addEventListener('input',e=>{
  S.q=e.target.value;
  document.getElementById('clearBtn').style.display=S.q?'inline-block':'none';
  RP();
});

// ========== INIT - FORCE LOAD FROM GITHUB ==========
(async function init(){
  console.log('🚀 INIT: Git connected?', G.ok);
  
  if(G.ok){
    syn('🔄 Fetching latest data from GitHub...','load');
    console.log('📡 Fetching from:', G.owner+'/'+G.repo);
    
    try {
      // DIRECT API CALL - no function wrapper
      let ctrl = new AbortController();
      let timeout = setTimeout(() => ctrl.abort(), 12000);
      
      let response = await fetch(`https://api.github.com/repos/${encodeURIComponent(G.owner)}/${encodeURIComponent(G.repo)}/contents/${G.path}`, {
        headers: {'Authorization': `Bearer ${G.token}`, 'Accept': 'application/vnd.github.v3+json'},
        signal: ctrl.signal
      });
      clearTimeout(timeout);
      
      if (!response.ok) throw new Error('HTTP ' + response.status);
      
      let fileData = await response.json();
      let data = JSON.parse(atob(fileData.content));
      
      console.log('📦 GitHub data:', data);
      console.log('📦 Company name from GitHub:', data.com?.name);
      
      // FORCE OVERWRITE STATE
      if (data.cat?.length) {
        S.cat = data.cat;
        console.log('✅ Categories loaded:', S.cat.length);
      }
      if (data.com?.name) {
        S.com = data.com;
        console.log('✅ Company loaded:', S.com.name);
      }
      if (data.st?.length) {
        S.st = data.st;
        console.log('✅ Stats loaded');
      }
      if (data.ft?.length) {
        S.ft = data.ft;
        console.log('✅ Features loaded');
      }
      
      // FORCE UI REFRESH
      refresh();
      
      syn('✅ Latest data loaded from GitHub!','ok');
      console.log('✅ UI refreshed with GitHub data');
      
    } catch(e) {
      console.error('❌ GitHub load error:', e.message);
      syn('⚠️ ' + e.message + ' — using defaults','fail');
      refresh();
    }
  } else {
    console.log('ℹ️ No Git config — using defaults');
    refresh();
  }
  
  updateBtn();
  
  // Tab focus = re-pull
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && G.ok) {
      console.log('🔄 Tab visible — re-pulling...');
      gitPull().catch(e => console.log('Pull error:', e));
    }
  });
})();
</script>
</body>
</html>
