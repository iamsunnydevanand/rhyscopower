<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Rhysco Power</title>
  <style>
    :root { --bg: #f5f5f7; --bg-2: #fff; --text: #1a1a2e; --text-2: #4a4a6a; --border: rgba(0,0,0,0.08); --card-bg: rgba(255,255,255,0.7); --nav-bg: rgba(255,255,255,0.78); --grad: linear-gradient(135deg, #00d4ff 0%, #7c3aed 50%, #ec4899 100%); --grad-warm: linear-gradient(135deg, #f97316 0%, #ff2d75 100%); --wa: #25D366; --success: #10b981; --danger: #ef4444; }
    [data-theme="dark"] { --bg: #0a0a0f; --bg-2: #111118; --text: #fff; --text-2: #a0a0b0; --border: rgba(255,255,255,0.08); --card-bg: rgba(18,18,28,0.72); --nav-bg: rgba(10,10,18,0.72); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    button { cursor: pointer; border: none; background: none; color: inherit; font-family: inherit; }
    input { font-family: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 14px; width: 100%; }
    .grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    
    /* SIMPLE LAYOUT */
    .nav { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); width: 95%; max-width: 1200px; z-index: 100; background: var(--nav-bg); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 999px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px; }
    .logo-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--grad); display: grid; place-items: center; color: #fff; }
    .nav-links { display: flex; gap: 4px; }
    .nav-links a { font-size: 13px; padding: 6px 12px; border-radius: 999px; opacity: .8; }
    .admin-btn { padding: 8px 14px; border-radius: 999px; background: var(--grad-warm); color: #fff; font-size: 12px; font-weight: 700; }
    .admin-btn.danger { background: #ef4444; }
    
    .hero { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 100px 20px; position: relative; }
    .hero-bg { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(124,58,237,0.4), rgba(0,212,255,0.25)), url('https://images.unsplash.com/photo-1473073077800-fe50b8c5e0c2?w=1200&q=80') center/cover; filter: brightness(0.5); }
    .hero-content { position: relative; z-index: 2; color: #fff; }
    .hero h1 { font-size: clamp(40px, 6vw, 70px); font-weight: 900; }
    .hero p { font-size: 16px; opacity: .9; margin: 10px 0 24px; }
    .cta { display: inline-block; padding: 14px 28px; border-radius: 999px; background: var(--grad); color: #fff; font-weight: 700; }
    
    section { max-width: 1100px; margin: 0 auto; padding: 60px 16px; }
    .section-head { text-align: center; margin-bottom: 30px; }
    .section-head h2 { font-size: clamp(28px, 4vw, 44px); font-weight: 900; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
    .card h3 { font-size: 14px; margin: 6px 0; }
    .card .spec { font-size: 11px; color: #06b6d4; }
    .card .actions { display: flex; gap: 6px; margin-top: 10px; }
    .btn-wa, .btn-detail { flex: 1; padding: 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: #fff; text-align: center; }
    .btn-wa { background: var(--wa); }
    .btn-detail { background: var(--grad); }
    
    .features-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .feat { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 22px; }
    .feat h3 { font-size: 16px; font-weight: 800; margin: 8px 0 4px; }
    .feat p { font-size: 13px; color: var(--text-2); }
    
    .contact-card { display: grid; grid-template-columns: 1fr 1fr; background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px; overflow: hidden; }
    @media (max-width: 700px) { .contact-card { grid-template-columns: 1fr; } }
    .contact-left { padding: 30px; background: var(--grad); color: #fff; }
    .contact-left h2 { font-size: 28px; font-weight: 900; }
    .contact-right { padding: 30px; }
    .contact-item { display: flex; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; }
    
    footer { text-align: center; padding: 30px; color: var(--text-2); font-size: 12px; }
    
    .float-wa { position: fixed; bottom: 16px; right: 16px; width: 50px; height: 50px; background: var(--wa); border-radius: 50%; display: grid; place-items: center; color: #fff; z-index: 80; }
    
    /* MODAL */
    .modal { position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-card { width: 100%; max-width: 600px; max-height: 85vh; background: var(--bg-2); border-radius: 20px; overflow-y: auto; padding: 20px; }
    .modal-close { float: right; width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,0.1); display: grid; place-items: center; }
    
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; }
    .btn { padding: 10px 18px; border-radius: 10px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .btn-primary { background: var(--grad); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    
    .tabs { display: flex; gap: 4px; margin-bottom: 14px; background: var(--border); padding: 3px; border-radius: 12px; }
    .tabs button { flex: 1; padding: 8px; border-radius: 9px; font-size: 12px; font-weight: 600; }
    .tabs button.active { background: var(--bg-2); }
    
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-2); border: 1px solid var(--border); padding: 10px 18px; border-radius: 10px; font-size: 13px; z-index: 300; display: none; }
    .toast.show { display: block; }
    
    /* DEBUG LOG */
    .debug-log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 200px; overflow-y: auto; background: #000; color: #0f0; font-family: monospace; font-size: 11px; padding: 8px; z-index: 999; display: none; }
    .debug-log.show { display: block; }
  </style>
</head>
<body>

  <!-- DEBUG LOG -->
  <div class="debug-log" id="debugLog"></div>

  <nav class="nav">
    <a href="#" class="logo"><span class="logo-mark">⚡</span><span class="grad-text" id="navName">Rhysco Power</span></a>
    <div class="nav-links"><a href="#home">Home</a><a href="#products">Products</a><a href="#contact">Contact</a></div>
    <button class="admin-btn" id="adminBtn" onclick="openAdmin()">🔑 Admin</button>
  </nav>

  <section class="hero" id="home">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <h1 id="heroTitle">Complete <span class="grad-text">Electrical</span> Solutions</h1>
      <p id="heroSubtitle"></p>
      <a href="#products" class="cta">Explore Products →</a>
    </div>
  </section>

  <div class="stats" id="statsGrid"></div>

  <section id="products">
    <div class="section-head"><h2>Our <span class="grad-text">Products</span></h2></div>
    <div class="grid" id="productsGrid"></div>
  </section>

  <section id="features"><div class="section-head"><h2>Why <span class="grad-text">Choose Us</span></h2></div><div class="features-grid" id="featuresGrid"></div></section>

  <section id="contact">
    <div class="contact-card">
      <div class="contact-left"><h2>Get In Touch</h2><p style="margin-top:10px">Contact us for bulk orders</p><a id="contactWa" href="#" target="_blank" class="cta" style="display:inline-block;margin-top:16px">💬 WhatsApp</a></div>
      <div class="contact-right" id="contactRight"></div>
    </div>
  </section>

  <footer>© <span id="footerText"></span></footer>
  <a id="floatWa" href="#" target="_blank" class="float-wa">💬</a>

  <!-- ADMIN MODAL -->
  <div class="modal" id="adminModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAdmin()">✕</button>
      <h3 style="margin-bottom:14px">Admin Panel</h3>
      <div class="tabs" id="adminTabs">
        <button onclick="setTab('company')" id="tabCompany">Company</button>
        <button onclick="setTab('git')" id="tabGit">🔗 Git</button>
      </div>
      <div id="adminContent"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ========== DEBUG LOGGER ==========
function log(msg, color = '#0f0') {
  console.log('[DEBUG]', msg);
  const logEl = document.getElementById('debugLog');
  logEl.classList.add('show');
  logEl.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

// ========== DATA ==========
let companyData = { name: 'Rhysco Power', tagline: 'Premium Electrical Solutions', phone: '+91 6203691393', email: 'test@test.com', whatsapp: '916203691393', address: 'India', heroTitle: 'Complete Electrical Solutions', heroSubtitle: 'WAA Cables • Solar & MC4 • Meters • Earthing • Fire Safety • Accessories' };
let products = [{ id: 'p1', name: '4.00SQMM WAA CABLE RED BLACK', spec: '100 MTR', icon: '🔌', desc: 'Premium 100% pure copper flexible cable', category: 'WAA Cables' }];
let stats = [{ icon: '⭐', number: '15+', label: 'Years' },{ icon: '📦', number: '1', label: 'Products' },{ icon: '👥', number: '1000+', label: 'Clients' },{ icon: '🚚', number: 'PAN India', label: 'Delivery' }];
let features = [{ icon: '🛡️', title: 'Quality Assured', desc: 'ISO certified' },{ icon: '🎧', title: '24/7 Support', desc: 'Always available' },{ icon: '🚚', title: 'Fast Delivery', desc: 'Nationwide' }];

// ========== GIT CONFIG ==========
let gitConfig = { owner: '', repo: 'rhysco-data', branch: 'main', token: '', path: 'data.json' };
let gitConnected = false;

// Load saved git config
try {
  const saved = JSON.parse(localStorage.getItem('rc_git') || '{}');
  if (saved.owner && saved.token) {
    gitConfig = { ...gitConfig, ...saved };
    gitConnected = true;
    log('✅ Git config loaded: ' + gitConfig.owner + '/' + gitConfig.repo, '#0f0');
  }
} catch(e) { log('❌ Error loading git config: ' + e.message, '#f00'); }

// ========== TOAST ==========
function toast(msg) {
  log('🔔 Toast: ' + msg, '#ff0');
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ========== RENDER ==========
function renderAll() {
  document.getElementById('navName').textContent = companyData.name;
  document.getElementById('heroTitle').innerHTML = companyData.heroTitle.replace(/Electrical/gi, '<span class="grad-text">Electrical</span>');
  document.getElementById('heroSubtitle').textContent = companyData.heroSubtitle;
  document.getElementById('footerText').textContent = new Date().getFullYear() + ' ' + companyData.name;
  document.title = companyData.name;
  
  document.getElementById('statsGrid').innerHTML = stats.map(s => `<div class="stat"><div class="stat-icon">${s.icon}</div><div class="stat-num">${s.number}</div><div class="stat-label">${s.label}</div></div>`).join('');
  document.getElementById('featuresGrid').innerHTML = features.map(f => `<div class="feat"><div style="font-size:30px">${f.icon}</div><h3>${f.title}</h3><p>${f.desc}</p></div>`).join('');
  document.getElementById('productsGrid').innerHTML = products.map(p => `<div class="card"><div style="font-size:28px">${p.icon}</div><h3>${p.name}</h3><div class="spec">📏 ${p.spec}</div><p style="font-size:12px;color:var(--text-2)">${p.desc}</p><div class="actions"><a class="btn-wa" href="https://wa.me/${companyData.whatsapp}" target="_blank">💬 Enquiry</a><button class="btn-detail">Details</button></div></div>`).join('');
  
  document.getElementById('contactRight').innerHTML = [
    { l:'Phone', v:companyData.phone },
    { l:'Email', v:companyData.email },
    { l:'Address', v:companyData.address }
  ].map(i => `<div class="contact-item"><div><strong>${i.l}</strong></div><div>${i.v}</div></div>`).join('');
  
  document.getElementById('floatWa').href = 'https://wa.me/' + companyData.whatsapp;
  document.getElementById('contactWa').href = 'https://wa.me/' + companyData.whatsapp;
}

// ========== GITHUB API ==========
async function testGitConnection() {
  log('🔄 Testing GitHub connection...', '#0ff');
  log('URL: https://api.github.com/repos/' + gitConfig.owner + '/' + gitConfig.repo, '#0ff');
  log('Token starts with: ' + gitConfig.token.substring(0, 4) + '...', '#0ff');
  
  try {
    const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(gitConfig.owner)}/${encodeURIComponent(gitConfig.repo)}`, {
      headers: {
        'Authorization': `Bearer ${gitConfig.token}`,
        'Accept': 'application/vnd.github.v3+json'
      }
    });
    
    log('Response status: ' + res.status, res.ok ? '#0f0' : '#f00');
    
    if (res.status === 401) {
      log('❌ ERROR 401: Invalid token! Token galat hai ya expire ho gaya.', '#f00');
      throw new Error('Invalid token. Generate new token at github.com/settings/tokens');
    }
    if (res.status === 403) {
      log('❌ ERROR 403: Forbidden! Token me "repo" scope nahi hai.', '#f00');
      throw new Error('Token needs "repo" permission');
    }
    if (res.status === 404) {
      log('❌ ERROR 404: Repository not found! Repo: ' + gitConfig.owner + '/' + gitConfig.repo, '#f00');
      throw new Error('Repository not found. Create it on GitHub first.');
    }
    
    const data = await res.json();
    log('✅ Connected! Repo: ' + data.full_name, '#0f0');
    return true;
  } catch(e) {
    log('❌ Connection error: ' + e.message, '#f00');
    throw e;
  }
}

async function pushToGitHub() {
  log('📤 Pushing data to GitHub...', '#0ff');
  
  const pushData = {
    company: companyData,
    products: products,
    stats: stats,
    features: features,
    lastSync: new Date().toISOString()
  };
  
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(pushData, null, 2))));
  log('Data size: ' + content.length + ' chars', '#0ff');
  
  let sha = null;
  try {
    const fileRes = await fetch(`https://api.github.com/repos/${encodeURIComponent(gitConfig.owner)}/${encodeURIComponent(gitConfig.repo)}/contents/${gitConfig.path}`, {
      headers: { 'Authorization': `Bearer ${gitConfig.token}`, 'Accept': 'application/vnd.github.v3+json' }
    });
    if (fileRes.ok) {
      const fileData = await fileRes.json();
      sha = fileData.sha;
      log('Existing file SHA: ' + sha, '#0ff');
    } else {
      log('File doesnt exist yet, will create new', '#0ff');
    }
  } catch(e) {
    log('Checking existing file: ' + e.message, '#ff0');
  }
  
  const body = {
    message: 'Update ' + new Date().toLocaleString(),
    content: content,
    branch: gitConfig.branch
  };
  if (sha) body.sha = sha;
  
  const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(gitConfig.owner)}/${encodeURIComponent(gitConfig.repo)}/contents/${gitConfig.path}`, {
    method: 'PUT',
    headers: {
      'Authorization': `Bearer ${gitConfig.token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  
  log('Push response: ' + res.status, res.ok ? '#0f0' : '#f00');
  
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    log('❌ Push error: ' + (err.message || 'Unknown'), '#f00');
    throw new Error(err.message || 'Push failed');
  }
  
  log('✅ Successfully pushed to GitHub!', '#0f0');
  return true;
}

async function loadFromGitHub() {
  log('📥 Loading data from GitHub...', '#0ff');
  
  const res = await fetch(`https://api.github.com/repos/${encodeURIComponent(gitConfig.owner)}/${encodeURIComponent(gitConfig.repo)}/contents/${gitConfig.path}`, {
    headers: { 'Authorization': `Bearer ${gitConfig.token}`, 'Accept': 'application/vnd.github.v3+json' }
  });
  
  if (!res.ok) {
    log('❌ Load failed: ' + res.status, '#f00');
    throw new Error('Failed to load');
  }
  
  const fileData = await res.json();
  const content = JSON.parse(atob(fileData.content));
  log('✅ Loaded data from GitHub', '#0f0');
  log('Company: ' + (content.company?.name || 'N/A'), '#0f0');
  log('Products: ' + (content.products?.length || 0), '#0f0');
  
  if (content.company) companyData = content.company;
  if (content.products) products = content.products;
  if (content.stats) stats = content.stats;
  if (content.features) features = content.features;
  
  renderAll();
  return true;
}

// ========== ADMIN FUNCTIONS ==========
let currentTab = 'git';

function openAdmin() {
  document.getElementById('adminModal').classList.add('open');
  setTab('git');
}

function closeAdmin() {
  document.getElementById('adminModal').classList.remove('open');
}

function setTab(tab) {
  currentTab = tab;
  document.getElementById('tabCompany').classList.toggle('active', tab === 'company');
  document.getElementById('tabGit').classList.toggle('active', tab === 'git');
  
  const content = document.getElementById('adminContent');
  
  if (tab === 'git') {
    content.innerHTML = `
      <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px">
        <h4 style="margin-bottom:12px">🔗 GitHub Sync Settings</h4>
        <p style="font-size:12px;color:var(--text-2);margin-bottom:14px">
          <strong>Step 1:</strong> Create repo on GitHub<br>
          <strong>Step 2:</strong> Get token from <a href="https://github.com/settings/tokens" target="_blank" style="color:#06b6d4">github.com/settings/tokens</a> (select <strong>repo</strong> scope)<br>
          <strong>Step 3:</strong> Enter below and Save
        </p>
        <div class="field">
          <label>GitHub Username</label>
          <input id="gitOwner" value="${gitConfig.owner}" placeholder="your-username">
        </div>
        <div class="field">
          <label>Personal Access Token</label>
          <input id="gitToken" type="password" value="${gitConfig.token}" placeholder="ghp_xxxxxxxxxxxx">
        </div>
        <div class="field">
          <label>Repository (default: rhysco-data)</label>
          <input id="gitRepo" value="${gitConfig.repo}" placeholder="rhysco-data">
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="saveGitAndSync()">💾 Save & Sync</button>
          ${gitConnected ? `<button class="btn btn-success" onclick="pushToGitHub().then(()=>toast('✅ Pushed!')).catch(e=>toast('❌ '+e.message))">📤 Push Now</button>` : ''}
          ${gitConnected ? `<button class="btn btn-success" onclick="loadFromGitHub().then(()=>toast('✅ Loaded!')).catch(e=>toast('❌ '+e.message))">📥 Load from GitHub</button>` : ''}
        </div>
        <div style="margin-top:8px;font-size:12px;padding:8px;background:${gitConnected?'rgba(16,185,129,0.1)':'rgba(239,68,68,0.1)'};border-radius:8px">
          Status: <strong style="color:${gitConnected?'#10b981':'#ef4444'}">${gitConnected ? '✅ Connected to ' + gitConfig.owner + '/' + gitConfig.repo : '⚡ Not connected'}</strong>
        </div>
      </div>
      <div style="margin-top:12px;font-size:11px;color:var(--text-2)">
        <button onclick="document.getElementById('debugLog').classList.toggle('show')" style="text-decoration:underline">Toggle Debug Log</button>
      </div>
    `;
  } else if (tab === 'company') {
    content.innerHTML = `
      <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px">
        <h4 style="margin-bottom:12px">Company Settings</h4>
        <div class="field"><label>Name</label><input id="compName" value="${companyData.name}"></div>
        <div class="field"><label>Hero Title</label><input id="compHeroTitle" value="${companyData.heroTitle}"></div>
        <div class="field"><label>Hero Subtitle</label><input id="compHeroSub" value="${companyData.heroSubtitle}"></div>
        <div class="field"><label>Phone</label><input id="compPhone" value="${companyData.phone}"></div>
        <button class="btn btn-primary" style="margin-top:10px" onclick="saveCompany()">💾 Save Company</button>
      </div>
    `;
  }
}

// ========== MAIN SAVE FUNCTION ==========
async function saveGitAndSync() {
  log('🚀 saveGitAndSync() called', '#ff0');
  
  const ownerEl = document.getElementById('gitOwner');
  const tokenEl = document.getElementById('gitToken');
  const repoEl = document.getElementById('gitRepo');
  
  if (!ownerEl || !tokenEl) {
    log('❌ ERROR: Input fields not found!', '#f00');
    toast('❌ Error: Fields not found');
    return;
  }
  
  const owner = ownerEl.value.trim();
  const token = tokenEl.value.trim();
  const repo = repoEl ? repoEl.value.trim() || 'rhysco-data' : 'rhysco-data';
  
  log('Owner: ' + owner, '#0ff');
  log('Token: ' + (token ? token.substring(0,4) + '...' : 'EMPTY'), '#0ff');
  log('Repo: ' + repo, '#0ff');
  
  if (!owner) {
    log('❌ Username empty', '#f00');
    toast('⚠️ Please enter GitHub username');
    return;
  }
  if (!token) {
    log('❌ Token empty', '#f00');
    toast('⚠️ Please enter token');
    return;
  }
  if (!token.startsWith('ghp_') && !token.startsWith('github_pat_')) {
    log('⚠️ Token format may be wrong. Expected ghp_ or github_pat_', '#ff0');
    toast('⚠️ Token should start with ghp_ or github_pat_');
  }
  
  // Save config
  gitConfig.owner = owner;
  gitConfig.token = token;
  gitConfig.repo = repo;
  
  try {
    localStorage.setItem('rc_git', JSON.stringify({ owner, token, repo, branch: 'main' }));
    log('✅ Git config saved to localStorage', '#0f0');
  } catch(e) {
    log('❌ localStorage save failed: ' + e.message, '#f00');
  }
  
  gitConnected = true;
  toast('🔄 Testing connection...');
  
  try {
    log('Testing connection...', '#0ff');
    await testGitConnection();
    log('✅ Connection test passed!', '#0f0');
    
    toast('📤 Pushing data...');
    await pushToGitHub();
    toast('✅ Successfully synced to GitHub!');
    
    setTab('git'); // Refresh tab
  } catch(e) {
    log('❌ Failed: ' + e.message, '#f00');
    toast('❌ ' + e.message);
  }
}

function saveCompany() {
  const name = document.getElementById('compName')?.value?.trim();
  if (!name) return toast('Name required');
  
  companyData.name = name;
  companyData.heroTitle = document.getElementById('compHeroTitle')?.value || companyData.heroTitle;
  companyData.heroSubtitle = document.getElementById('compHeroSub')?.value || companyData.heroSubtitle;
  companyData.phone = document.getElementById('compPhone')?.value || companyData.phone;
  
  renderAll();
  
  if (gitConnected) {
    pushToGitHub().then(() => toast('✅ Saved & synced')).catch(e => toast('⚠️ Saved locally only'));
  } else {
    toast('✅ Saved (connect Git to sync)');
  }
}

// ========== INIT ==========
renderAll();

// Load from GitHub on start
if (gitConnected) {
  log('🔄 Auto-loading from GitHub...', '#0ff');
  loadFromGitHub()
    .then(() => log('✅ Initial load complete', '#0f0'))
    .catch(() => log('⚠️ Using default data', '#ff0'));
} else {
  log('ℹ️ Git not configured. Open Admin → Git to connect.', '#0ff');
}

log('✅ App ready! Open Admin → Git tab', '#0f0');
</script>
</body>
</html>
